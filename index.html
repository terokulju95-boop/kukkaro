<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ec">
  <meta name="description" content="Kukkaro – tulot, menot, toistuvat laskut ja säästöt palkkajaksoittain.">
  <meta name="robots" content="noindex">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kukkaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Kukkaro</title>
</head>
<body>
  <div id="boot" class="boot"><div class="spinner"></div><p>Ladataan…</p></div>

  <section id="auth" class="auth" hidden></section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <h1 id="title" class="topbar-title">Kukkaro</h1>
        <div id="netstatus" class="net" hidden>Ei yhteyttä – muutokset tallentuvat, kun yhteys palaa</div>
      </div>
    </header>
    <main id="view" class="view"></main>
    <div id="fab"></div>
    <nav id="nav" class="bottomnav" aria-label="Päävalikko"></nav>
  </div>

  <div id="modal" class="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
  <script>
    // Jos sovellus ei käynnisty (esim. js-kansio puuttuu GitHubista), näytetään syy pyörivän latauksen sijaan
    setTimeout(function () {
      var b = document.getElementById("boot");
      if (!b || b.hidden) return;
      fetch("js/main.js", { cache: "no-store" }).then(function (r) {
        b.innerHTML = r.ok
          ? '<p>Sovellus ei käynnistynyt.</p><p style="font-size:.9rem;opacity:.8">Tarkista verkkoyhteys ja lataa sivu uudelleen. Jos ongelma jatkuu, jokin tiedosto js-kansiossa puuttuu tai on vanha.</p><button onclick="location.reload()">Lataa uudelleen</button>'
          : '<p>Sovelluksen tiedostoja ei löydy.</p><p style="font-size:.9rem;opacity:.8">GitHub-reposta puuttuu js-kansio (js/main.js). Lataa js- ja icons-kansiot repoon.</p>';
      }).catch(function () { b.innerHTML = "<p>Ei verkkoyhteyttä.</p>"; });
    }, 8000);
  </script>
</body>
</html>
